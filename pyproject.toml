[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unknown_unknowns"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy", "diptest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
